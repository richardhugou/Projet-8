name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Installer les dépendances
        run: uv sync --all-extras --dev
      
      - name: Linter (Ruff)
        run: uvx ruff check
        
      - name: Formatter (Ruff)
        run: uvx ruff format --check
        
      - name: Exécution des tests avec couverture (Pytest-cov)
        run: uv run python3 -m pytest --cov=api tests/



  deploy-huggingface:
    name: Sync to Hugging Face Spaces
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hub
        env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
            git push --force https://trikwi:$HF_TOKEN@huggingface.co/spaces/trikwi/ScoringP8 HEAD:main
