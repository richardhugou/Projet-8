name: CI/CD Placeholder

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Installer les dépendances
        run: |
          # Utilisation de uv pour synchroniser l'environnement
          uv sync --all-extras --dev

      - name: Vérification du code (Linting)
        run: |
          # Exemple de vérification : on peut ajouter ruff plus tard
          echo "Placeholder pour le linting"

      - name: Exécution des tests
        run: |
          # Exemple d'exécution de tests via uv script
          uv run main.py
